defaults:
- _self_
- override hydra/job_logging: disabled
- override hydra/hydra_logging: disabled
ENV_NAME: MPE_simple_tag_scripted_prey_6v2
SEED: 0
"ENV_KWARGS": {
  "max_steps": 256,
  "score_function": "min",
  "reward_mode": "dense",
  "dense_reward_scale": 1.0,
}

FC_DIM_SIZE: 64
GRU_HIDDEN_DIM: 64
Q_INIT_SCALE: 0.01
ALPHA_INIT: 0.1
FIXED_ALPHA: true
TARGET_ENTROPY_RATIO: 0.5
ALPHA_MIN: 0.05
ALPHA_MAX: 0.5
USE_ADVANTAGE_NORM: false
TOTAL_TIMESTEPS: 3e7
NUM_ENVS: 16
NUM_STEPS: 256
NUM_EPOCHS: 6
ACTOR_LR: 0.0005
CRITIC_LR: 0.0003
ALPHA_LR: 0.0003
GAMMA: 0.99
TAU: 0.005
MAX_GRAD_NORM: 0.5
BUFFER_SIZE: 50000
BUFFER_BATCH_SIZE: 256
LEARNING_STARTS: 10000
LR_LINEAR_DECAY: false
WANDB_MODE: disabled
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
