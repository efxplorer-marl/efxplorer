defaults:
  - efxplorer_ippo_config
  - _self_

share_param_critic: False
clip_epsilon: 0.15
entropy_coef: 0.0
critic_coef: 0.5
loss_critic_type: "l2"
lmbda: 0.9
scale_mapping: "biased_softplus_1.0"
use_tanh_normal: True
minibatch_advantage: False
critic_int_lr: 5.0e-5
critic_lr: 1.0e-4

intrinsic_gamma: 0.99
intrinsic_reward_type: "tdd"
intrinsic_reward_scale: 1.0
extrinsic_only: False
intrinsic_only: False

use_tdd: True
tdd_latent_dim: 128
tdd_output_dim: 32
tdd_learning_rate: 0.002
tdd_discount: 0.9
tdd_batch_size: 512
tdd_learning_epochs: 16

agent_feature_up_to_velocity: False
z_ema_alpha: 0.1
z0_best_reward_decay: 0.99
warmup_rollouts: 0
adv_clip_abs: 5.0
use_soft_min: False
soft_min_tau: 0.1
ablation_current: false