[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmarl"
version = "1.5.1"
description = "BenchMARL - Benchmarking Multi-Agent Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BenchMARL contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# Core dependencies - exact versions matching setup.py
# Note: torch is not included here as it's typically installed separately
dependencies = [
    "torchrl==0.10.1",
    "tqdm==4.67.1",
    "hydra-core==1.3.2",
    "torchvision==0.24.1",
    "av==13.1.0",
    "numpy==1.26.4",
]

[project.optional-dependencies]
# vmas is optional - users can install their own version
vmas = [
    "vmas>=1.3.4",  # Optional: users typically install their own vmas
]
pettingzoo = [
    "pettingzoo[all]>=1.24.3",
]
meltingpot = [
    "dm-meltingpot",
]
gnn = [
    "torch_geometric",
]
logging = [
    "moviepy",
    "wandb",
]
all = [
    "vmas>=1.3.4",
    "pettingzoo[all]>=1.24.3",
    "dm-meltingpot",
    "torch_geometric",
    "moviepy",
    "wandb",
]



[tool.setuptools]
# Use find_packages() from setup.py - packages will be auto-discovered
packages = {find = {}}

[tool.setuptools.package-data]
# Include conf files as in setup.py
"benchmarl" = ["conf/**/*"]
